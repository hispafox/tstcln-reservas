<h1>Mis reservas</h1>

<div>
  Persona: <input [(ngModel)]="persona" (change)="cargar()" />
  <app-filtros-reservas [(soloConfirmadas)]="soloConfirmadas" [(orden)]="orden" />
</div>

@if (cargando()) {
  <div>Cargando...</div>
}
@if (error()) {
  <div class="error">{{ error() }}</div>
}

<app-tabla-reservas [reservas]="visibles()" (cancelacionPedida)="cancelar($event)" />
