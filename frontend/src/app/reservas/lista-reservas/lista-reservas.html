<h1>Mis reservas</h1>

<div>
  Persona: <input [(ngModel)]="persona" (change)="cargar()" />
  <label><input type="checkbox" [ngModel]="soloConfirmadas()" (ngModelChange)="soloConfirmadas.set($event)" /> Solo las próximas confirmadas</label>
  Ordenar por:
  <select [ngModel]="orden()" (ngModelChange)="orden.set($event)">
    <option value="fecha">fecha</option>
    <option value="sala">sala</option>
    <option value="duracion">duración</option>
  </select>
</div>

@if (aviso()) {
  <div class="aviso">{{ aviso() }}</div>
}
@if (cargando()) {
  <div>Cargando...</div>
}
@if (error()) {
  <div class="error">{{ error() }}</div>
}

<app-tabla-reservas [reservas]="visibles()" (cancelacionPedida)="cancelar($event)" />
