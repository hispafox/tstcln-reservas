<h1>Reservar la sala {{ sala() }}</h1>

<form (submit)="$event.preventDefault(); reservar()">
  <label>
    Fecha
    <input type="date" [value]="fecha()" (input)="fecha.set($any($event.target).value)" />
  </label>
  <label>
    Hora de inicio
    <input type="time" [value]="horaInicio()" (input)="horaInicio.set($any($event.target).value)" />
  </label>
  <label>
    Hora de fin
    <input type="time" [value]="horaFin()" (input)="horaFin.set($any($event.target).value)" />
  </label>
  <label>
    Persona
    <input type="text" [value]="persona()" (input)="persona.set($any($event.target).value)" />
  </label>
  <label>
    Asistentes
    <input
      type="number"
      min="1"
      [value]="asistentes() ?? ''"
      (input)="cambiarAsistentes($any($event.target).value)"
    />
  </label>

  <button type="submit" [disabled]="enviando()">Reservar</button>
</form>

@if (error(); as mensaje) {
  <p role="alert">{{ mensaje }}</p>
}
@if (confirmada(); as reserva) {
  <p role="status">Reserva confirmada para {{ reserva.persona }}.</p>
}
